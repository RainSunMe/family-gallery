# Production-oriented compose file.
# Copy .env.example to .env, replace every placeholder, then run:
#   docker compose up -d --build
#
# The application image already contains the built frontend, so web/dist is
# intentionally NOT mounted. Mounting it would shadow the image contents.

services:
  app:
    image: ghcr.io/rainsunme/family-gallery:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family-gallery
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/gallery.db
    volumes:
      - app_data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  app_data:
